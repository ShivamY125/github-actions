name: 09-Using Functions
on:
   pull_request:
   workflow_dispatch:
jobs:
    echo1:
        runs-on: ubuntu-latest
        steps:
            - name: "Sleep for 20 second"
              run: sleep 20
            - name: "failing Steps"
              run: 
                 exit 1
            - name: "I will be skipped"
              if: ${{success()}}
              run: echo "I will print the rpevious steps succeded"
            - name: "I will be executed"
              if: ${{!cancelled()}}
              run: echo "I will always print, except when the workflow is cancelled."
            - name: "I will execute when cancelled."
              if: ${{cancelled()}}
              run: echo "run"

